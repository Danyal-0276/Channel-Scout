name: Verify ChannelScout

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: channel_scout_test
          POSTGRES_USER: scout_test
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout_test -d channel_scout_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHANNELSCOUT_TEST_POSTGRES: '1'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: channel_scout_test
      POSTGRES_USER: scout_test
      POSTGRES_PASSWORD: disposable-ci-fixture
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
